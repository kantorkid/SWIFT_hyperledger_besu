server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: besu-node-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: besu
          node: node-1
          __path__: /var/log/besu/node1.log

      - targets:
          - localhost
        labels:
          job: besu
          node: node-2
          __path__: /var/log/besu/node2.log

      - targets:
          - localhost
        labels:
          job: besu
          node: node-3
          __path__: /var/log/besu/node3.log

      - targets:
          - localhost
        labels:
          job: besu
          node: node-4
          __path__: /var/log/besu/node4.log